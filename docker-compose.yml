version: "3.9"

services:
  hexstrike:
    build: .
    image: hexstrike-ai:latest
    container_name: hexstrike-ai
    user: "0:0"
    tty: true
    stdin_open: true
    working_dir: /workspace
    environment:
      HEXSTRIKE_HOST: 0.0.0.0
      HEXSTRIKE_PORT: 8888
    volumes:
      - ./data:/workspace/data
    ports:
      - "8888:8888"
    command:
      - hexstrike_server.py
      - "--port"
      - "8888"
